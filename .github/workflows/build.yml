name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: npm run package:win
          - name: macOS
            os: macos-latest
            command: npm run package:mac
          - name: Linux
            os: ubuntu-latest
            command: npm run package -- --linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        if: matrix.name != 'macOS'
        run: ${{ matrix.command }}

      - name: Build and verify macOS package
        if: matrix.name == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signed_release=false
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "Building a Developer ID signed and notarized universal app"
            npm run package:mac
            signed_release=true
          else
            echo "::warning::Apple signing secrets are incomplete; building a fully ad-hoc signed universal app"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npm run package:mac:adhoc
          fi

          app_path="release/mac-universal/PClaw.app"
          test -d "$app_path"

          if [[ "$signed_release" != true ]]; then
            codesign --force --deep --sign - "$app_path"

            version="$(node -p "require('./package.json').version")"
            dmg_path="release/PClaw-${version}-universal.dmg"
            blockmap_path="${dmg_path}.blockmap"
            update_metadata="release/latest-mac.yml"
            dmg_stage="release/dmg-stage"
            verify_mount="release/dmg-verify"

            rm -f "$dmg_path" "$blockmap_path" "$update_metadata"
            rm -rf "$dmg_stage"
            mkdir -p "$dmg_stage"
            ditto "$app_path" "$dmg_stage/PClaw.app"
            ln -s /Applications "$dmg_stage/Applications"
            hdiutil create -volname "PClaw ${version}" -srcfolder "$dmg_stage" -ov -format UDZO "$dmg_path"
            hdiutil verify "$dmg_path"
            rm -rf "$dmg_stage"

            rm -rf "$verify_mount"
            mkdir -p "$verify_mount"
            hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$verify_mount"
            codesign --verify --deep --strict --verbose=2 "$verify_mount/PClaw.app"
            hdiutil detach "$verify_mount"
            rm -rf "$verify_mount"
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PClaw-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PClaw-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.blockmap
            release-assets/latest*.yml
          generate_release_notes: true
          fail_on_unmatched_files: false
